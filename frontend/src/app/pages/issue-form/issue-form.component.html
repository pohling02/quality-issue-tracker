<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>{{ isEditMode ? 'Edit Issue' : 'Create New Issue' }}</h2>
        <a routerLink="/issues" class="btn btn-outline-secondary">Back to List</a>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

      <div class="card shadow-sm">
        <div class="card-body">
          <form [formGroup]="issueForm" (ngSubmit)="onSubmit()">
            
            <!-- Title -->
            <div class="mb-3">
              <label class="form-label fw-bold">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="title"
                     [ngClass]="{'is-invalid': issueForm.get('title')?.touched && issueForm.get('title')?.invalid}">
              <div class="invalid-feedback">Title is required and must be at least 3 characters.</div>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label class="form-label fw-bold">Description is?</label>
              <textarea class="form-control" rows="4" formControlName="description"></textarea>
            </div>

            <div class="row">
              <!-- Severity -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Severity</label>
                <select class="form-select" formControlName="severity">
                  <option value="Low">Low</option>
                  <option value="Medium">Medium</option>
                  <option value="High">High</option>
                </select>
              </div>

              <!-- Status -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Status</label>
                <select class="form-select" formControlName="status">
                  <option value="Open">Open</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Closed">Closed</option>
                </select>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-end mt-4">
              <a routerLink="/issues" class="btn btn-light me-2">Cancel</a>
              <button type="submit" class="btn btn-primary px-4" [disabled]="issueForm.invalid">
                {{ isEditMode ? 'Save Changes' : 'Create Issue' }}
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
