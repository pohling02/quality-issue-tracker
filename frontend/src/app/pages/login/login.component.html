<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">Login</h3>
          
          <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
          
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="email" 
                     [ngClass]="{'is-invalid': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}">
              <div class="invalid-feedback">A valid email is required.</div>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" formControlName="password"
                     [ngClass]="{'is-invalid': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}">
              <div class="invalid-feedback">Password must be at least 6 characters.</div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Log In</button>
          </form>
          
          <div class="text-center mt-3">
            <a routerLink="/register" class="text-decoration-none">Don't have an account? Register</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
